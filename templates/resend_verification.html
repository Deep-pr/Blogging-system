{% extends 'base.html' %}
{% block content %}
{% load crispy_forms_tags %}

<div class="min-h-screen flex items-center justify-center py-12 px-4"
     style="background: linear-gradient(135deg, #fdf8f0 0%, #fef3c7 100%);">
  <div class="w-full max-w-md">

    <div class="h-1.5 w-full rounded-t-2xl"
         style="background: linear-gradient(90deg, #92400e, #d97706, #fbbf24);"></div>

    <div class="bg-white rounded-b-2xl px-8 pt-8 pb-10 border border-t-0 relative overflow-hidden"
         style="border-color:#e5d5bf; box-shadow: 0 20px 60px rgba(26,18,8,0.12);">

      <div class="absolute -top-10 -right-10 w-40 h-40 rounded-full opacity-5 pointer-events-none" style="background:#d97706;"></div>
      <div class="absolute -bottom-10 -left-10 w-32 h-32 rounded-full opacity-5 pointer-events-none" style="background:#fbbf24;"></div>

      <!-- Header -->
      <div class="text-center mb-8 relative z-10">
        <div class="w-14 h-14 rounded-full flex items-center justify-center mx-auto mb-4"
             style="background: linear-gradient(135deg, #1a1208, #3d2b0a);">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none"
               viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" style="color:#fbbf24;">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7
                     a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
        </div>
        <h1 class="font-display text-2xl font-black mb-1" style="color:#1a1208;">Resend Verification</h1>
        <p class="text-sm" style="color:#7c6f5e;">Enter your email to receive a fresh verification link</p>
      </div>

      <form action="{% url 'resend_verification' %}" method="POST" class="relative z-10">
        {% csrf_token %}

        <label class="block text-xs font-semibold uppercase tracking-wider mb-1.5"
               style="color:#7c6f5e;">Email Address</label>
        <input type="email" name="email" required autofocus
               class="w-full px-4 py-2.5 rounded-lg border text-sm outline-none transition-all"
               style="border:1.5px solid #e5d5bf; color:#1a1208; background:#fffcf7;
                      font-family:'DM Sans',sans-serif;"
               placeholder="you@example.com"
               onfocus="this.style.borderColor='#d97706'; this.style.boxShadow='0 0 0 3px rgba(217,119,6,0.15)'"
               onblur="this.style.borderColor='#e5d5bf'; this.style.boxShadow='none'">

        <button type="submit"
                class="w-full mt-5 py-3 rounded-lg font-bold text-sm uppercase tracking-widest text-white
                       transition-all duration-200 hover:-translate-y-0.5 flex items-center justify-center gap-2"
                style="background: linear-gradient(135deg, #d97706, #b45309);
                       box-shadow: 0 4px 14px rgba(217,119,6,0.35);">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none"
               viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
          </svg>
          Send Verification Link
        </button>
      </form>

      <div class="text-center mt-5">
        <a href="{% url 'login' %}" class="text-sm font-medium hover:underline"
           style="color:#d97706;">← Back to Sign In</a>
      </div>
    </div>

    <p class="text-center text-xs mt-4" style="color:#a89070;">
      Link expires after 24 hours.
    </p>
  </div>
</div>
{% endblock %}
