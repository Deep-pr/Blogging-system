{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<section class="max-w-xl mx-auto">
  <div class="premium-card overflow-hidden">
    <div class="px-6 py-5 border-b" style="border-color:#e5d5bf; background:rgba(255,252,247,0.82);">
      <p class="section-kicker mb-2">Set Password</p>
      <h1 class="section-subtitle text-[2rem]">Choose a new password</h1>
    </div>

    <div class="p-6">
      {% if validlink %}
      <form method="POST" class="space-y-5">
        {% csrf_token %}
        <div class="auth-form">
          {{ form|crispy }}
        </div>
        <button type="submit" class="btn-amber">
          Update Password
        </button>
      </form>
      {% else %}
      <p class="section-copy mb-4">
        This reset link is invalid or expired. Please request a fresh one.
      </p>
      <a href="{% url 'password_reset' %}" class="btn-outline inline-flex">
        Request New Link
      </a>
      {% endif %}
    </div>
  </div>
</section>
{% endblock %}
