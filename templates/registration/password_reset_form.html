{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<section class="max-w-xl mx-auto">
  <div class="premium-card overflow-hidden">
    <div class="px-6 py-5 border-b" style="border-color:#e5d5bf; background:rgba(255,252,247,0.82);">
      <p class="section-kicker mb-2">Account Recovery</p>
      <h1 class="section-subtitle text-[2rem]">Forgot your password?</h1>
      <p class="section-copy text-sm mt-3">Enter your account email and we will send a secure reset link.</p>
    </div>

    <form method="POST" class="p-6 space-y-5">
      {% csrf_token %}
      <div class="auth-form">
        {{ form|crispy }}
      </div>

      <button type="submit" class="btn-amber">
        Send Reset Link
      </button>
      <p class="text-xs" style="color:#7c6f5e;">
        Remembered your password?
        <a href="{% url 'login' %}" class="font-semibold hover:underline" style="color:#d97706;">Back to sign in</a>
      </p>
    </form>
  </div>
</section>
{% endblock %}
