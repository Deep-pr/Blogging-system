{% extends 'base.html' %}

{% block content %}
<section class="max-w-xl mx-auto">
  <div class="premium-card p-8 text-center">
    <p class="section-kicker mb-3">Email Sent</p>
    <h1 class="section-subtitle text-[2rem] mb-3">Check your inbox</h1>
    <p class="section-copy">
      If an account exists for that email, you will receive a password reset link shortly.
    </p>
    <a href="{% url 'login' %}" class="btn-outline mt-6 inline-flex">
      Back to Sign In
    </a>
  </div>
</section>
{% endblock %}
