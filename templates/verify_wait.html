{% extends 'base.html' %}
{% block content %}

<div class="min-h-screen flex items-center justify-center py-12 px-4"
     style="background: linear-gradient(135deg, #fdf8f0 0%, #fef3c7 100%);">
  <div class="w-full max-w-md">

    <div class="h-1.5 w-full rounded-t-2xl"
         style="background: linear-gradient(90deg, #92400e, #d97706, #fbbf24);"></div>

    <div class="bg-white rounded-b-2xl px-8 pt-10 pb-10 border border-t-0 text-center relative overflow-hidden"
         style="border-color:#e5d5bf; box-shadow: 0 20px 60px rgba(26,18,8,0.12);">

      <div class="absolute -top-10 -right-10 w-40 h-40 rounded-full opacity-5 pointer-events-none" style="background:#d97706;"></div>
      <div class="absolute -bottom-10 -left-10 w-32 h-32 rounded-full opacity-5 pointer-events-none" style="background:#fbbf24;"></div>

      <!-- Waiting state -->
      <div id="waiting-state" class="relative z-10">
        <!-- Spinning icon -->
        <div class="w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-5"
             style="background: linear-gradient(135deg, #1a1208, #3d2b0a);">
          <svg id="spin-icon" xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none"
               viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" style="color:#fbbf24;">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7
                     a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
        </div>

        <h1 class="font-display text-2xl font-black mb-2" style="color:#1a1208;">Check your email</h1>
        <p class="text-sm mb-2" style="color:#7c6f5e;">
          We sent a verification link to
        </p>
        <p class="text-sm font-bold mb-6" style="color:#d97706;">{{ email }}</p>

        <!-- Pulse dots -->
        <div class="flex items-center justify-center gap-2 mb-6">
          <span class="w-2 h-2 rounded-full" style="background:#d97706; animation: pulse1 1.2s infinite;"></span>
          <span class="w-2 h-2 rounded-full" style="background:#d97706; animation: pulse1 1.2s infinite 0.2s;"></span>
          <span class="w-2 h-2 rounded-full" style="background:#d97706; animation: pulse1 1.2s infinite 0.4s;"></span>
        </div>

        <p class="text-xs" style="color:#a89070;">Waiting for verification — this page will update automatically</p>

        <div class="flex items-center gap-3 my-6">
          <div class="flex-1 h-px" style="background:#e5d5bf;"></div>
          <span class="text-xs" style="color:#a89070;">didn't receive it?</span>
          <div class="flex-1 h-px" style="background:#e5d5bf;"></div>
        </div>

        <a href="{% url 'resend_verification' %}"
           class="text-sm font-semibold underline" style="color:#d97706;">
          Resend verification email
        </a>
      </div>

      <!-- Verified state (hidden initially) -->
      <div id="verified-state" class="relative z-10" style="display:none;">
        <div class="w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-5"
             style="background: linear-gradient(135deg, #065f46, #059669);">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none"
               viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
          </svg>
        </div>
        <h1 class="font-display text-2xl font-black mb-2" style="color:#1a1208;">Email Verified!</h1>
        <p class="text-sm mb-6" style="color:#7c6f5e;">Taking you to your dashboard...</p>
        <div class="w-full h-1.5 rounded-full overflow-hidden" style="background:#e5d5bf;">
          <div id="progress-bar" class="h-full rounded-full" style="background: linear-gradient(90deg, #d97706, #fbbf24); width:0%; transition: width 2s linear;"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<style>
  @keyframes pulse1 {
    0%, 100% { opacity: 0.3; transform: scale(0.8); }
    50%       { opacity: 1;   transform: scale(1.2); }
  }
</style>

<script>
  const userId = "{{ user_id }}";
  const checkUrl = `/check-verification/${userId}/`;

  function poll() {
    fetch(checkUrl)
      .then(r => r.json())
      .then(data => {
        if (data.verified) {
          // Show verified state
          document.getElementById('waiting-state').style.display = 'none';
          document.getElementById('verified-state').style.display  = 'block';

          // Animate progress bar then redirect
          setTimeout(() => {
            document.getElementById('progress-bar').style.width = '100%';
          }, 100);
          setTimeout(() => {
            window.location.href = data.redirect;
          }, 2200);
        } else {
          setTimeout(poll, 3000);  // poll every 3 seconds
        }
      })
      .catch(() => setTimeout(poll, 4000));
  }

  poll();
</script>

{% endblock %}
